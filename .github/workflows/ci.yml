name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify Java backend (tests, Modulith, ArchUnit, Checkstyle, OpenRewrite)
        run: ./mvnw verify -B

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Typecheck Cloudflare Worker
        working-directory: cloudflare
        run: |
          npm ci
          npm run typecheck
