name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install, typecheck, and test
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Inject D1 database ID (and optional R2 bucket) from GitHub config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "Error: D1_DATABASE_ID secret is not set" >&2
            exit 1
          fi
          node -e '
            const fs = require("fs");
            function stripJsonc(input) {
              let out = "";
              let inString = false;
              let escaped = false;
              for (let i = 0; i < input.length; i++) {
                const ch = input[i];
                const next = input[i + 1];
                if (inString) {
                  out += ch;
                  if (escaped) {
                    escaped = false;
                  } else if (ch === "\\") {
                    escaped = true;
                  } else if (ch === "\"") {
                    inString = false;
                  }
                  continue;
                }
                if (ch === "\"") {
                  inString = true;
                  out += ch;
                  continue;
                }
                if (ch === "/" && next === "/") {
                  while (i + 1 < input.length && input[i + 1] !== "\n") i++;
                  continue;
                }
                if (ch === "/" && next === "*") {
                  i += 2;
                  while (i < input.length && !(input[i] === "*" && input[i + 1] === "/")) i++;
                  i++;
                  continue;
                }
                out += ch;
              }
              let finalOut = "";
              inString = false;
              escaped = false;
              for (let i = 0; i < out.length; i++) {
                const ch = out[i];
                if (inString) {
                  finalOut += ch;
                  if (escaped) {
                    escaped = false;
                  } else if (ch === "\\") {
                    escaped = true;
                  } else if (ch === "\"") {
                    inString = false;
                  }
                  continue;
                }
                if (ch === "\"") {
                  inString = true;
                  finalOut += ch;
                  continue;
                }
                if (ch === ",") {
                  let j = i + 1;
                  while (j < out.length && /\s/.test(out[j])) j++;
                  if (out[j] === "}" || out[j] === "]") continue;
                }
                finalOut += ch;
              }
              return finalOut;
            }
            const raw = fs.readFileSync("wrangler.jsonc", "utf8");
            const cfg = JSON.parse(stripJsonc(raw));
            const dbId = process.env.D1_DATABASE_ID.trim();
            const dbEntry = Array.isArray(cfg.d1_databases)
              ? cfg.d1_databases.find((d) => d.database_id === "REPLACE_WITH_YOUR_D1_DATABASE_ID" || d.binding === "DB")
              : null;
            if (!dbEntry) {
              throw new Error("Missing D1 database entry in wrangler.jsonc");
            }
            dbEntry.database_id = dbId;
            if (process.env.R2_BUCKET_NAME && process.env.R2_BUCKET_NAME.trim()) {
              const bucketName = process.env.R2_BUCKET_NAME.trim();
              cfg.r2_buckets = [
                {
                  binding: "UPLOADS",
                  bucket_name: bucketName,
                },
              ];
              console.log("Bound R2 bucket:", bucketName);
            } else {
              console.log("R2_BUCKET_NAME not set — deploying without R2 photo persistence.");
            }
            fs.writeFileSync("wrangler.jsonc", JSON.stringify(cfg, null, 2) + "\n");
          '

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:remote

      - name: Deploy Worker (Free Tier)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
