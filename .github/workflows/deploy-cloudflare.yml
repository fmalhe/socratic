name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install, typecheck, and test
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Inject D1 database ID (and optional R2 bucket) from GitHub config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "Error: D1_DATABASE_ID secret is not set" >&2
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("wrangler.jsonc", "utf8");
            const cfg = JSON.parse(raw.replace("REPLACE_WITH_YOUR_D1_DATABASE_ID", process.env.D1_DATABASE_ID));
            if (process.env.R2_BUCKET_NAME) {
              cfg.r2_buckets = [
                {
                  binding: "UPLOADS",
                  bucket_name: process.env.R2_BUCKET_NAME.trim(),
                },
              ];
              console.log("Bound R2 bucket:", process.env.R2_BUCKET_NAME.trim());
            } else {
              console.log("R2_BUCKET_NAME not set — deploying without R2 photo persistence.");
            }
            fs.writeFileSync("wrangler.jsonc", JSON.stringify(cfg, null, 2) + "\n");
          '

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:remote

      - name: Deploy Worker (Free Tier)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
